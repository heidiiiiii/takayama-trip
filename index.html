        background-position: center;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(44, 36, 28, 0.32));
      }
      .leaf {
        position: absolute;
        border-radius: 70% 0 70% 0;
        transform: rotate(45deg);
        opacity: 0.28;
      }
      .timeline-line::before {
        content: "";
        position: absolute;
        left: 40px;
        top: 20px;
        bottom: 20px;
        width: 1px;
        background: var(--line);
        z-index: 0;
      }
      .expand-content {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.35s ease, opacity 0.25s ease;
      }
      .expanded .expand-content {
        max-height: 3200px;
        opacity: 1;
      }
      .check-item input[type="checkbox"]:checked + div {
        background: var(--moss);
        border-color: var(--moss);
      }
      .check-item input[type="checkbox"]:checked + div::after {
        content: "✓";
        color: white;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .check-item input[type="checkbox"]:checked ~ span {
        text-decoration: line-through;
        opacity: 0.52;
      }
      .bottom-nav {
        width: min(95vw, 430px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .bottom-nav::-webkit-scrollbar { display: none; }
      button, a { touch-action: manipulation; }
      .event-card {

        min-width: 0;
        overflow: hidden;
      }

      }

      async function updateTemperatureByLocation(locationName) {
        const coords = locationCoords[locationName];
        const tempEl = document.getElementById("temp-val");
        if (!coords) {
          tempEl.innerText = "--°C";
          return;
        }
        try {
          const url = "https://api.open-meteo.com/v1/forecast?latitude=" + coords.lat + "&longitude=" + coords.lon + "&current_weather=true";
          const res = await fetch(url);
          const data = await res.json();
          tempEl.innerText = Math.round(data.current_weather.temperature) + "°C";
        } catch (err) {
          tempEl.innerText = "--°C";
        }

      function formatTransportInfo(text) {
        return text
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            return '<div class="transport-row">' + formatTransportInline(line) + '</div>';
          })
          .join("");
      }

      function formatTransportInline(text) {
        return escapeHtmlText(text)
          .replace(/\{red\s*[：:]\s*([^{}]+)\}/g, '<span class="transport-red">$1</span>')
          .replace(/\{blue\s*[：:]\s*([^{}]+)\}/g, '<span class="transport-blue">$1</span>')
          .replace(/\{green\s*[：:]\s*([^{}]+)\}/g, '<span class="transport-green">$1</span>')
          .replace(/\*\*([^*]+)\*\*/g, '<span class="transport-strong">$1</span>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) =>
            '<a href="' + url + '" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-[#b9472f] underline underline-offset-2 font-black"><i data-lucide="external-link" class="w-3.5 h-3.5"></i>' + label + '</a>'
          );
      }

      function escapeHtmlText(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatTextLinks(text) {
        return escapeHtmlText(text)
          .split("\n")
          .map((line) => {
            return line.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) =>
              '<a href="' + url + '" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-[#b9472f] underline underline-offset-2 font-black"><i data-lucide="external-link" class="w-3.5 h-3.5"></i>' + label + '</a>'
            );
          })
          .join("\n");
      }

      function formatNoteInfo(text) {

                      ${reservedHtml}
                    </div>
                    <h3 class="event-title text-[17px] font-black text-[#3f3a32] leading-snug">${ev.title}</h3>
                    <div class="flex items-center gap-2 mt-2 min-w-0">
                      <p class="text-[12px] text-[#7c7264] font-bold leading-snug flex items-center min-w-0 flex-1"><i data-lucide="map-pin" class="w-4 h-4 mr-1.5 flex-shrink-0"></i><span class="event-loc">${ev.loc || ""}</span></p>
                      <a href="${mapSearch(ev.loc || ev.title)}" target="_blank" class="p-2 rounded-full bg-[#f8f3ea] text-[#b9472f] active:scale-90 transition" onclick="event.stopPropagation()"><i data-lucide="external-link" class="w-4 h-4"></i></a>
                    </div>
                  </div>
                  <i data-lucide="chevron-down" class="w-5 h-5 text-[#bda88d] transition-transform group-[.expanded]:rotate-180"></i>
                </div>
                <div class="expand-content">
                  <div class="space-y-3 pt-4 pb-3 mt-4 border-t border-[#f0e5d5] min-w-0">
                    ${transportHtml}
                    <p class="text-[15px] text-[#4f463b] leading-relaxed font-medium whitespace-pre-line">${ev.intro ? formatTextLinks(ev.intro) : ""}</p>
                    ${noteHtml}
                    ${linkPills(ev.saved)}
                  </div>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      function renderChecklist(container) {
        document.getElementById("header-title").innerText = "必備攜帶清單";
        document.getElementById("header-subtitle").innerText = "Travel Preparation";
        setWeatherVisible(false);
        container.classList.remove("timeline-line");
        container.innerHTML = '<div class="space-y-4 pb-12">' + checklistData.map((cat) =>
          '<section class="bg-white rounded-3xl p-5 shadow-sm"><h3 class="text-base font-black text-[#3f3a32] mb-4 flex items-center gap-2"><i data-lucide="check-square" class="w-5 h-5 text-[#b9472f]"></i>' + cat.category + '</h3><div class="grid grid-cols-1 gap-3">' + cat.items.map((item) =>
            '<label class="check-item flex items-center gap-3 cursor-pointer py-1"><input type="checkbox" class="hidden"><div class="w-6 h-6 rounded-full border-2 border-[#cdb99e] transition-all flex-shrink-0"></div><span class="text-[15px] text-[#3f3a32] font-bold transition-all">' + item + '</span></label>'
          ).join("") + '</div></section>'
        ).join("") + '</div>';
      }

      function renderTips(container) {
        document.getElementById("header-title").innerText = "秋日旅行提醒";
        document.getElementById("header-subtitle").innerText = "Guidance";
        setWeatherVisible(false);
        container.classList.remove("timeline-line");
        container.innerHTML = '<div class="space-y-4 pb-12">' + tipsData.map((tip) =>
          '<section class="bg-white rounded-3xl p-5 shadow-sm flex gap-4"><div class="mt-1 w-12 h-12 rounded-2xl bg-[#edf1e6] flex items-center justify-center flex-shrink-0"><i data-lucide="' + tip.icon + '" class="w-6 h-6 text-[#64735a]"></i></div><div><h3 class="text-base font-black text-[#3f3a32] mb-2">' + tip.title + '</h3><p class="text-[15px] text-[#5f5549] font-medium leading-relaxed">' + tip.content + '</p></div></section>'
        ).join("") + '</div>';
      }

      function renderLang(container) {
        document.getElementById("header-title").innerText = "常用日文";
        document.getElementById("header-subtitle").innerText = "Travel Phrases";
        setWeatherVisible(false);
        container.classList.remove("timeline-line");
        container.innerHTML = '<div class="space-y-5 pb-12">' + phrasesData.map((cat) =>
          '<section><h3 class="text-[13px] font-black text-[#b9472f] tracking-widest uppercase mb-3 ml-2 border-l-4 border-[#b9472f] pl-3">' + cat.cat + '</h3><div class="grid grid-cols-1 gap-3">' + cat.list.map((item) =>
            '<div class="bg-white rounded-3xl p-5 shadow-sm"><span class="inline-block text-[12px] font-black text-[#b9472f] bg-[#fff0df] px-3 py-1 rounded-full mb-3">' + item.zh + '</span><p class="text-lg font-black text-[#3f3a32] leading-tight">' + item.en + '</p><p class="text-base font-bold text-[#3f3a32] leading-tight mt-2">' + item.jp + '</p><p class="text-sm text-[#7c7264] italic font-bold mt-1">' + item.pron + '</p></div>'
          ).join("") + '</div></section>'
        ).join("") + '</div>';
      }

      function renderContent() {
        const container = document.getElementById("main-content");
        container.innerHTML = "";
        container.classList.remove("timeline-line");
        if (currentView === "home") renderHome(container);
        else if (typeof currentView === "number") renderDay(container);
        else if (currentView === "checklist") renderChecklist(container);
        else if (currentView === "tips") renderTips(container);
        else if (currentView === "lang") renderLang(container);
        lucide.createIcons();
      }

      window.onload = () => setView("home");
    </script>
  </body>
</html>
